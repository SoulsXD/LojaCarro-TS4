name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Diz ao GitHub para executar todos os comandos 'run' dentro da subpasta do projeto
    defaults:
      run:
        working-directory: ./TSI4M-LojaCarro-dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build project
        run: ./mvnw -B clean package -DskipTests

  tests:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./TSI4M-LojaCarro-dev

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run unit tests
        run: ./mvnw -B test
